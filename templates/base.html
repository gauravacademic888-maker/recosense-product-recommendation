<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RecoSense{% endblock %}</title>
<style>
:root{--ink:#17222d;--mute:#5d6b78;--line:#dfe5ea;--bg:#f4f7f9;--card:#fff;--brand:#0b6b63;--brand2:#e08a1e;--soft:#e3f1ef}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--ink);color:#fff;padding:14px 28px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none}
.logo{font-size:20px;font-weight:700;letter-spacing:.3px}
.tag{color:#9fb3c2;font-size:14px}
nav{margin-left:auto;display:flex;gap:18px;font-size:15px}
nav a:hover{text-decoration:underline}
main{max-width:1100px;margin:26px auto;padding:0 20px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mute);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:13px}
tr:hover td{background:#f9fbfc}
a.link{color:var(--brand);font-weight:600;text-decoration:none}a.link:hover{text-decoration:underline}
.bar{display:grid;grid-template-columns:210px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bar i{display:block;height:16px;background:var(--brand);border-radius:3px}
.bar a{color:var(--ink);text-decoration:none}.bar a:hover{text-decoration:underline}
.note{color:var(--mute);font-size:13px;grid-column:2/4;margin-top:-4px}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--soft);color:var(--brand);font-size:13px;font-weight:600}
.pill.hv{background:#fdeccf;color:#8a4b00}.pill.ia{background:#fbe0e0;color:#a12626}
form.search{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#fff}
button{background:var(--brand);color:#fff;border-color:var(--brand);cursor:pointer}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.rec{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand2);border-radius:6px;padding:14px}
.rec b{font-size:17px;display:block}.rec small{color:var(--mute)}
.rec p{margin:8px 0 0;font-size:14px;color:var(--brand);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}.bar{grid-template-columns:130px 1fr 40px}}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">RecoSense</a><span class="tag">AI product recommendation for small online stores</span>
  <nav><a href="/">Dashboard</a><a href="/product/1">Product Targeting</a><a href="/api/recommend/1">API Demo</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
